services:
  postgres:
    image: postgres:16
    container_name: jaa-postgres
    environment:
      POSTGRES_USER: jaa
      POSTGRES_PASSWORD: jaa
      POSTGRES_DB: jaa
    ports:
      - "5432:5432"
    volumes:
      - jaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaa -d jaa"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  jaa_pgdata:
