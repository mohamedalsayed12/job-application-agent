services:
  postgres:
    image: postgres:16
    container_name: jaa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jaa
      POSTGRES_PASSWORD: jaa
      POSTGRES_DB: jaa
    ports:
      - "5436:5432"
    volumes:
      - jaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaa -d jaa"]
      interval: 3s
      timeout: 5s
      retries: 10

  # Catches account emails (confirm, reset) locally and sends nothing on. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21.0
    container_name: jaa-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  jaa_pgdata:
