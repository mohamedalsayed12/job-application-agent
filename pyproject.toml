[project]
name = "job-application-agent"
version = "0.1.0"
description = "Job discovery with data quality — Milestone 1 schema"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.33",
    "pwdlib[argon2]>=0.3.1",
    "itsdangerous>=2.2.0",
    "limits>=5.8.0",
    "pypdf>=5",
]

[project.optional-dependencies]
semantic = [
    "fastembed>=0.7",
    "pypdf>=5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
