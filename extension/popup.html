<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Job Agent Apply</title>
  <style>
    body { font: 13px/1.4 system-ui, sans-serif; margin: 12px; width: 280px; }
    label { display: block; margin: 8px 0 4px; }
    input { width: 100%; box-sizing: border-box; }
    button { margin-top: 10px; width: 100%; }
    .hint { color: #555; font-size: 12px; }
    #status { margin-top: 8px; }
  </style>
</head>
<body>
  <strong>Job Agent Apply Fill</strong>
  <p class="hint">Fills the open apply tab. Never clicks Submit.</p>
  <label>API base <input id="apiBase" placeholder="http://127.0.0.1:8000"/></label>
  <label>Extension token <input id="token" type="password" autocomplete="off"/></label>
  <label>Application <select id="application"></select></label>
  <button id="save" type="button">Save</button>
  <button id="fill" type="button">Fill this tab</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
